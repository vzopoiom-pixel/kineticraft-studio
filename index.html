<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KinetiCraft - Creative Web & Interactive UI Studio</title>
    <meta name="description" content="Interactive HTML5, CSS3 and JavaScript creative studio showcasing modern UI effects, responsive tools and live project estimator" />
    <meta property="og:title" content="KinetiCraft - Creative Web & Interactive UI Studio" />
    <meta property="og:description" content="Interactive HTML5, CSS3 and JavaScript creative studio showcasing modern UI effects, responsive tools and live project estimator" />
    <!-- SVG Favicon: Sharp Geometric IH Monogram -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ffffff'%3E%3Crect width='24' height='24' fill='%23000000'/%3E%3Ctext x='12' y='16' font-family='monospace' font-size='11' font-weight='bold' fill='%23ffffff' text-anchor='middle'%3EIH%3C/text%3E%3C/svg%3E" />
    <!-- Google Fonts: Syne (Display) & Plus Jakarta Sans (Clean Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Syne:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      body {
        margin: 0;
        background-color: #050505;
        color: #f5f5f5;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #050505;
        z-index: 9999;
      }
      .spinner {
        width: 36px;
        height: 36px;
        border: 2px solid #262626;
        border-top-color: #ffffff;
        border-radius: 0px;
        animation: spin 0.8s linear infinite;
      }
      .loader-text {
        margin-top: 16px;
        font-size: 11px;
        font-family: 'JetBrains Mono', monospace;
        font-weight: 700;
        color: #a3a3a3;
        letter-spacing: 0.15em;
        text-transform: uppercase;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-[#050505] text-[#f5f5f5]">
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div class="loader-text">INITIALIZING KINETICRAFT...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
